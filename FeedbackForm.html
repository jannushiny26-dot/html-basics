<!DOCTYPE html>
<html>
    <head>
        <title>Feedback Form</title>
    </head>
    <body>
        <form align="center">
            <h2>Feedback Form</h3><br>
            Name: <input type="text"><br><br>
            Email: <input type="email"><br><br>
            Feedback: <textarea name="feedback" rows="3" cols="18"></textarea><br><br>
            Satisfied?:<br>
            <input type="radio" name="option">Satisfied<br>
            <input type="radio" name="option">Average<br>
            <input type="radio" name="option">Not satisfied<br>
            <button type="submit">submit</button>
        </form>
    </body>
</html>
