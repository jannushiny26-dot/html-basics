<!DOCTYPE html>
<html>
    <head>
        <title>Simple Timetable Table</title>
    </head>
    <body >
        <h1> TIME TABLE </h1><br><br>
        <table border="1" cellpadding="18">
            <tr>
                <th>DAY/TIME</th>
                <th>9:10-10:10</th>
                <th>10:10-11:10</th>
                <th>11:10-12:10</th>
                <th>1:00-2:00</th>
                <th>2:00-3:00</th>
                <th>3:00-4:00</th>
            </tr>
            <tr>
                <td>MONDAY</td>
                <td>PE-I</td>
                <td>EEA</td>
                <td>POT</td>
                <td>DBMS</td>
                <td>LIBRARY</td>
                <td>SPORTS</td>
            </tr>
            <tr>
                <td>TUESDAY</td>
                <td colspan="2" align="center">DBMS LAB</td>
                <td>MP-I</td>
                <td>PQT</td>
                <td>EEA</td>
                <td>ES</td>
            </tr>
        <tr>
                <td>WEDNESDAY</td>
                <td>EAD</td>
                <td>PE-I</td>
                <td>PQT</td>
                <td>LIBRARY</td>
                <td>DBMS</td>
                <td>MP-I</td>
            </tr>
        </table>
    </body>
</html>
